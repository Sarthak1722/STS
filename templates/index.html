<!DOCTYPE html>
<html>
<head>
    <title>AI Conversation Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #f0f2f5;
            min-height: 100vh;
        }
        
        .chat-container {
            max-width: 800px;
            margin: 2rem auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .chat-header {
            background: #2563eb;
            color: white;
            padding: 1.5rem;
            text-align: center;
        }

        .chat-messages {
            height: 60vh;
            overflow-y: auto;
            padding: 1.5rem;
            background: #f8f9fa;
        }

        .message {
            display: flex;
            margin-bottom: 1.5rem;
            animation: fadeIn 0.3s ease-in;
        }

        .user-message {
            justify-content: flex-end;
        }

        .assistant-message .message-content {
            background: white;
            color: #1f2937;
        }

        .user-message .message-content {
            background: #2563eb;
            color: white;
        }

        .message-content {
            max-width: 70%;
            padding: 1rem 1.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin: 0 1rem;
            flex-shrink: 0;
        }

        .controls {
            padding: 1.5rem;
            background: white;
            border-top: 1px solid #e5e7eb;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .status-indicator {
            padding: 0.5rem 1rem;
            background: #e5e7eb;
            border-radius: 2rem;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        #transcript {
            display: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h2 class="mb-0">AI Conversation Assistant</h2>
            <div class="status-indicator mt-2" id="status">Disconnected</div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message assistant-message">
                <div class="avatar bg-primary text-white d-flex align-items-center justify-content-center">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="message-content">
                    Hello! How can I help you today?
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="d-flex gap-2">
                <button id="startBtn" onclick="startRecording()" class="btn btn-primary flex-grow-1">
                    <i class="fas fa-microphone"></i> Start Conversation
                </button>
                <button id="stopBtn" onclick="stopRecording()" class="btn btn-danger" disabled>
                    <i class="fas fa-stop"></i> Stop
                </button>
            </div>
        </div>
    </div>

    <script>
        let socket = null;
        let audioContext = null;
        let audioStream = null;
        let workletNode = null;
        
        const transcriptDiv = document.getElementById('transcript');
        const statusElement = document.getElementById('status');
        const audioPlayer = document.getElementById('audioPlayer');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');

        // Audio worklet processor code
        const workletCode = `
            class AudioProcessor extends AudioWorkletProcessor {
                constructor() {
                    super();
                    this.buffer = new Float32Array(4096);
                    this.bufferIndex = 0;
                }

                process(inputs, outputs) {
                    const input = inputs[0][0];
                    if (!input) return true;

                    // Fill buffer
                    for (let i = 0; i < input.length; i++) {
                        this.buffer[this.bufferIndex++] = input[i];
                        
                        if (this.bufferIndex >= this.buffer.length) {
                            // Convert and send buffer
                            const audioData = this.convertFloat32ToInt16(this.buffer);
                            this.port.postMessage({ audioData });
                            
                            // Reset buffer
                            this.bufferIndex = 0;
                        }
                    }
                    return true;
                }

                convertFloat32ToInt16(float32Array) {
                    const int16Array = new Int16Array(float32Array.length);
                    for (let i = 0; i < float32Array.length; i++) {
                        const s = Math.max(-1, Math.min(1, float32Array[i]));
                        int16Array[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                    }
                    return int16Array;
                }
            }

            registerProcessor('audio-processor', AudioProcessor);
        `;

        function initializeSocket() {
            socket = io('http://localhost:5000');
            // socket = io('http://ec2-44-223-67-245.compute-1.amazonaws.com:5000');



            socket.on('transcript', (data) => {
                const chatMessages = document.getElementById('chatMessages');
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message user-message';
                
                messageDiv.innerHTML = `
                    <div class="message-content">
                        ${data.text}
                    </div>
                    <div class="avatar bg-primary text-white d-flex align-items-center justify-content-center">
                        <i class="fas fa-user"></i>
                    </div>
                `;
                
                chatMessages.appendChild(messageDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            });

            socket.on('assistant_response', (data) => {
                const chatMessages = document.getElementById('chatMessages');
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message assistant-message';
                
                messageDiv.innerHTML = `
                    <div class="avatar bg-primary text-white d-flex align-items-center justify-content-center">
                        <i class="fas fa-robot"></i>
                    </div>
                    <div class="message-content">
                        ${data.text}
                    </div>
                `;
                
                chatMessages.appendChild(messageDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            });

            // Update status element styling
            socket.on('connect', () => {
                statusElement.textContent = 'Connected';
                statusElement.style.background = '#d1fae5';
                statusElement.style.color = '#065f46';
            });

            socket.on('disconnect', () => {
                statusElement.textContent = 'Disconnected';
                statusElement.style.background = '#fee2e2';
                statusElement.style.color = '#991b1b';
            });


            socket.on('audio', (data) => {
                // Play audio
                const audio = new Audio('data:audio/mpeg;base64,' + data.data);
                audio.play();
            });

            socket.on('status', (data) => {
                statusElement.textContent = data.message;
            });

            socket.on('error', (data) => {
                console.error('Socket error:', data.message);
                statusElement.textContent = data.message;
                statusElement.style.background = '#fee2e2';
                statusElement.style.color = '#991b1b';
            });
        }

        async function startRecording() {
            try {
                audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new AudioContext();
                
                // Create a new AudioWorklet
                const blob = new Blob([workletCode], { type: 'application/javascript' });
                const workletUrl = URL.createObjectURL(blob);
                await audioContext.audioWorklet.addModule(workletUrl);

                // Create and connect nodes
                const source = audioContext.createMediaStreamSource(audioStream);
                workletNode = new AudioWorkletNode(audioContext, 'audio-processor');
                
                workletNode.port.onmessage = (event) => {
                    if (socket && socket.connected && event.data.audioData) {
                        socket.emit('audio_data', {
                            audio: btoa(String.fromCharCode.apply(null, new Uint8Array(event.data.audioData.buffer)))
                        });
                    }
                };

                source.connect(workletNode);
                workletNode.connect(audioContext.destination);

                if (!socket) {
                    initializeSocket();
                }

                startBtn.disabled = true;
                stopBtn.disabled = false;
                statusElement.textContent = 'Recording...';
                transcriptDiv.innerHTML = '';
                audioPlayer.src = '';

            } catch (error) {
                console.error('Error starting recording:', error);
                statusElement.textContent = 'Error accessing microphone';
                statusElement.style.color = 'red';
            }
        }

        function stopRecording() {
            if (workletNode) {
                workletNode.disconnect();
                workletNode = null;
            }

            if (audioStream) {
                audioStream.getTracks().forEach(track => track.stop());
                audioStream = null;
            }

            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }

            if (socket) {
                socket.disconnect();
                socket = null;
            }

            startBtn.disabled = false;
            stopBtn.disabled = true;
            statusElement.textContent = 'Recording stopped';
        }
    </script>
</body>
</html>
